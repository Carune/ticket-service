services:
  api-server:
    ports: []

  mysql-container:
    ports: []

  redis-container:
    ports: []

  prometheus:
    ports: []

  grafana:
    ports: []

  nginx:
    image: nginx:1.27-alpine
    container_name: ticket-nginx
    depends_on:
      - api-server
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
